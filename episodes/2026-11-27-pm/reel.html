<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* =====================================================================================
   DIGITAL CRIMES reel engine v3  (1080x1920, 30 fps)
   - Copy this file to episodes/<date>/reel.html. Keep the ENGINE section unchanged.
   - Rewrite only the EPISODE section at the bottom: scene functions + window.EPISODE.
   - Scene functions get LOCAL time (lt = seconds since the scene started) and the scene length D.
     Use only local times inside scenes, so scene lengths can stretch to fit the voiceover.
   - Each scene has `dur` (length without voice) and `min` (time its animations need). With the AI voice,
     render.py sets length = max(min, clip + 0.8 s).
   - Sounds are listed per scene in local time: pops [t, Hz, gain], impacts [t, gain, shakePx],
     risers [t], ring [[a,b]], typing [[a,b]], stings [t], chimes [t] (notification chime).
   - v3 studio standard (content/strategy.md): window.EPISODE.series + .ep draw the series badge in the header and on the
     cover; a scene with chapter:[n,'THE SCAM'] gets the chapter wipe (about 1 s) + a sting, and its voice starts at
     0.7 s (voLead) instead of 0.3 s, so keep that scene's own content from about 0.8 s on.
     Components: seriesBadge, chapterCard, dramatisedTag, phoneFrame, callScreen, chatThread, smsCard, upiScreen,
     notificationBanner, moneyGraph, dataCard, kineticCaption, checklistCard (+ avatar, arrowTo, stamp, acct, coin,
     iBank, iCam, iATM, iCrypto, iCheque, iGold, handset). Mock screens: masked data and a DRAMATISED tag only.
   - Format (owner's instruction, 25 Nov 2026): reels are 35–45 s. Frame 1 is the hook: draw the hook text at full opacity
     from t = 0 and give the first scene voLead ≤ 0.1; no fade from black (EPISODE.fadeIn is off by default); use small
     corner chapter labels rather than full-screen chapter cards; at most one law card; a send line in the last 5 s.
   ===================================================================================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const buf=document.createElement('canvas'); buf.width=1080; buf.height=1920; const bctx=buf.getContext('2d');
const W=1080,H=1920;
const COL={bg0:'#03050b',bg1:'#0b1430',cyan:'#2ee6ff',red:'#ff3358',amber:'#ffb627',green:'#35f29a',violet:'#9b7bff',white:'#f3f6ff',dim:'#9aa7c7'};
const DISP='"Inter Display","Inter",sans-serif', BODY='"Inter",sans-serif', MONO='"DejaVu Sans Mono",monospace';

// ======================= ENGINE: helpers =======================
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const p=(t,s,d)=>clamp((t-s)/d);
const eOut=x=>1-Math.pow(1-x,3);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return (s%100000)/100000;}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function font(w,s,f){return `${w} ${s}px ${f||BODY}`;}
function fit(str,w,f,maxW,start,ls=0){ctx.save();let s=start;ctx.letterSpacing=ls+'px';while(s>20){ctx.font=font(w,s,f);if(ctx.measureText(str).width<=maxW)break;s-=2;}ctx.restore();return s;}
function txt(s,x,y,o={}){ctx.save();ctx.globalAlpha*=(o.alpha??1);ctx.font=font(o.weight||700,o.size||48,o.font);
  ctx.fillStyle=o.color||COL.white;ctx.textAlign=o.align||'left';ctx.textBaseline='alphabetic';ctx.letterSpacing=(o.ls||0)+'px';
  if(o.glow){ctx.shadowColor=o.glowColor||o.color||COL.white;ctx.shadowBlur=o.glow;}ctx.fillText(s,x,y);ctx.restore();}
function wrap(s,maxW,f){ctx.save();ctx.font=f;const words=s.split(' ');const lines=[];let cur='';
  for(const w of words){const tst=cur?cur+' '+w:w;if(ctx.measureText(tst).width>maxW&&cur){lines.push(cur);cur=w;}else cur=tst;}
  if(cur)lines.push(cur);ctx.restore();return lines;}
function para(s,x,y,maxW,o={}){const size=o.size||40;const L=wrap(s,maxW,font(o.weight||500,size,o.font));const lh=o.lh||size*1.28;
  L.forEach((l,i)=>txt(l,x,y+i*lh,o));return L.length;}
function nlines(s,maxW,o){return wrap(s,maxW,font(o.weight||500,o.size||40,o.font)).length;}
function stroke(c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';}
const lerp=(a,b,k)=>a+(b-a)*k;

// ---------- icons ----------
function shield(cx,cy,s,c,prog=1){ctx.save();stroke(c,s*0.13);ctx.shadowColor=c;ctx.shadowBlur=s*0.5;
  ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s*0.82,cy-s*0.66);ctx.lineTo(cx+s*0.78,cy+s*0.05);
  ctx.quadraticCurveTo(cx+s*0.6,cy+s*0.72,cx,cy+s*1.02);ctx.quadraticCurveTo(cx-s*0.6,cy+s*0.72,cx-s*0.78,cy+s*0.05);
  ctx.lineTo(cx-s*0.82,cy-s*0.66);ctx.closePath();if(prog<1)ctx.setLineDash([s*8*prog,s*8]);ctx.stroke();ctx.setLineDash([]);
  ctx.globalAlpha*=prog;ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx,cy-s*0.12,s*0.2,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx-s*0.1,cy-s*0.05);ctx.lineTo(cx+s*0.1,cy-s*0.05);ctx.lineTo(cx+s*0.06,cy+s*0.4);ctx.lineTo(cx-s*0.06,cy+s*0.4);ctx.closePath();ctx.fill();ctx.restore();}
function iPhone(cx,cy,s,c){ctx.save();stroke(c,s*0.12);rr(cx-s*0.5,cy-s*0.85,s,s*1.7,s*0.18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-s*0.15,cy-s*0.62);ctx.lineTo(cx+s*0.15,cy-s*0.62);ctx.stroke();ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx,cy+s*0.6,s*0.08,0,7);ctx.fill();ctx.restore();}
function iDoc(cx,cy,s,c){ctx.save();stroke(c,s*0.11);ctx.beginPath();ctx.moveTo(cx-s*0.6,cy-s*0.85);ctx.lineTo(cx+s*0.25,cy-s*0.85);
  ctx.lineTo(cx+s*0.6,cy-s*0.5);ctx.lineTo(cx+s*0.6,cy+s*0.85);ctx.lineTo(cx-s*0.6,cy+s*0.85);ctx.closePath();ctx.stroke();
  for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(cx-s*0.35,cy-s*0.35+i*s*0.3);ctx.lineTo(cx+s*0.35,cy-s*0.35+i*s*0.3);ctx.stroke();}
  ctx.beginPath();ctx.arc(cx+s*0.2,cy+s*0.55,s*0.16,0,7);ctx.stroke();ctx.restore();}
function iLock(cx,cy,s,c){ctx.save();stroke(c,s*0.12);rr(cx-s*0.6,cy-s*0.15,s*1.2,s*0.95,s*0.15);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy-s*0.15,s*0.38,Math.PI,0);ctx.stroke();ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx,cy+s*0.3,s*0.11,0,7);ctx.fill();ctx.restore();}
function iRupee(cx,cy,s,c){txt('₹',cx,cy+s*0.55,{size:s*1.5,weight:800,color:c,align:'center'});}
function iVideoOff(cx,cy,s,c){ctx.save();stroke(c,s*0.12);rr(cx-s*0.8,cy-s*0.45,s*1.1,s*0.9,s*0.15);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+s*0.35,cy-s*0.1);ctx.lineTo(cx+s*0.85,cy-s*0.38);ctx.lineTo(cx+s*0.85,cy+s*0.38);ctx.lineTo(cx+s*0.35,cy+s*0.1);ctx.stroke();
  stroke(COL.red,s*0.14);ctx.beginPath();ctx.moveTo(cx-s*0.85,cy-s*0.8);ctx.lineTo(cx+s*0.85,cy+s*0.8);ctx.stroke();ctx.restore();}
function iWarn(cx,cy,s,c){ctx.save();stroke(c,s*0.12);ctx.beginPath();ctx.moveTo(cx,cy-s*0.8);ctx.lineTo(cx+s*0.9,cy+s*0.75);ctx.lineTo(cx-s*0.9,cy+s*0.75);ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy-s*0.25);ctx.lineTo(cx,cy+s*0.22);ctx.stroke();ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx,cy+s*0.48,s*0.08,0,7);ctx.fill();ctx.restore();}
function iCross(cx,cy,s,c){ctx.save();stroke(c,s*0.16);ctx.beginPath();ctx.moveTo(cx-s*0.5,cy-s*0.5);ctx.lineTo(cx+s*0.5,cy+s*0.5);ctx.moveTo(cx+s*0.5,cy-s*0.5);ctx.lineTo(cx-s*0.5,cy+s*0.5);ctx.stroke();ctx.restore();}
function iGlobe(cx,cy,s,c){ctx.save();stroke(c,s*0.1);ctx.beginPath();ctx.arc(cx,cy,s*0.75,0,7);ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,cy,s*0.32,s*0.75,0,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-s*0.75,cy);ctx.lineTo(cx+s*0.75,cy);ctx.stroke();ctx.restore();}
function iFlag(cx,cy,s,c){ctx.save();stroke(c,s*0.12);ctx.beginPath();ctx.moveTo(cx-s*0.5,cy+s*0.85);ctx.lineTo(cx-s*0.5,cy-s*0.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-s*0.5,cy-s*0.75);ctx.lineTo(cx+s*0.6,cy-s*0.45);ctx.lineTo(cx-s*0.5,cy-s*0.1);ctx.stroke();ctx.restore();}
function iCheck(cx,cy,s,c,k=1){ctx.save();stroke(c,s*0.18);ctx.beginPath();const P=[[cx-s*0.5,cy],[cx-s*0.12,cy+s*0.38],[cx+s*0.55,cy-s*0.42]];
  ctx.moveTo(...P[0]);if(k<0.4){const q=k/0.4;ctx.lineTo(lerp(P[0][0],P[1][0],q),lerp(P[0][1],P[1][1],q));}
  else{ctx.lineTo(...P[1]);const q=(k-0.4)/0.6;ctx.lineTo(lerp(P[1][0],P[2][0],q),lerp(P[1][1],P[2][1],q));}ctx.stroke();ctx.restore();}
function iPin(cx,cy,s,c){ctx.save();ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=s*0.8;ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.bezierCurveTo(cx-s*0.9,cy-s*0.9,cx-s*0.7,cy-s*1.9,cx,cy-s*1.9);ctx.bezierCurveTo(cx+s*0.7,cy-s*1.9,cx+s*0.9,cy-s*0.9,cx,cy);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#0a1020';ctx.beginPath();ctx.arc(cx,cy-s*1.25,s*0.3,0,7);ctx.fill();ctx.restore();}

// ---------- tech components ----------
// lattice mobile tower: base centre (x,y), height h
function tower(x,y,h,c,lt=0,a=1){ctx.save();ctx.globalAlpha*=a;stroke(c,Math.max(3,h*0.022));const w=h*0.2;
  ctx.beginPath();ctx.moveTo(x-w,y);ctx.lineTo(x-w*0.22,y-h*0.86);ctx.moveTo(x+w,y);ctx.lineTo(x+w*0.22,y-h*0.86);ctx.stroke();
  ctx.lineWidth=Math.max(1.5,h*0.011);ctx.beginPath();const n=5;for(let i=0;i<n;i++){const f0=i/n,f1=(i+1)/n;const y0=y-h*0.86*f0,y1=y-h*0.86*f1;
    const x0=w-(w-w*0.22)*f0,x1=w-(w-w*0.22)*f1;ctx.moveTo(x-x0,y0);ctx.lineTo(x+x1,y1);ctx.moveTo(x+x0,y0);ctx.lineTo(x-x1,y1);}ctx.stroke();
  ctx.lineWidth=Math.max(3,h*0.02);ctx.beginPath();ctx.moveTo(x,y-h*0.86);ctx.lineTo(x,y-h);ctx.stroke();
  ctx.fillStyle=c;for(const dx of[-1,0,1]){rr(x+dx*w*0.34-h*0.022,y-h*0.84,h*0.044,h*0.13,h*0.01);ctx.fill();}
  const bl=0.5+0.5*Math.sin(lt*6);ctx.fillStyle=`rgba(255,51,88,${0.4+0.6*bl})`;ctx.shadowColor=COL.red;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(x,y-h,Math.max(3,h*0.018),0,7);ctx.fill();ctx.restore();}
// radio waves leaving a point
function waves(x,y,lt,c,n=3,maxR=120,a=1,a0=-Math.PI*0.75,a1=-Math.PI*0.25){ctx.save();for(let k=0;k<n;k++){const ph=((lt*0.9+k/n)%1);stroke(c,4);ctx.globalAlpha=a*(1-ph)*0.8;
  ctx.beginPath();ctx.arc(x,y,20+ph*maxR,a0,a1);ctx.stroke();}ctx.restore();}
// coverage slice (sector) with sweep k
function sector(x,y,r,a0,a1,c,alpha=0.25,k=1){if(k<=0)return;ctx.save();const g=ctx.createRadialGradient(x,y,10,x,y,r);g.addColorStop(0,c+'88');g.addColorStop(1,c+'00');
  ctx.globalAlpha*=alpha*3;ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,r,a0,a0+(a1-a0)*k);ctx.closePath();ctx.fill();
  ctx.globalAlpha=Math.min(1,alpha*3);stroke(c,2);ctx.beginPath();ctx.arc(x,y,r,a0,a0+(a1-a0)*k);ctx.stroke();ctx.restore();}
// small phone glyph with screen glow
function phone(cx,cy,w,c,glow=0.6){const h=w*1.9;ctx.save();rr(cx-w/2,cy-h/2,w,h,w*0.18);ctx.fillStyle='#0a0f1f';ctx.fill();stroke(c,Math.max(2,w*0.06));ctx.shadowColor=c;ctx.shadowBlur=20*glow;ctx.stroke();
  ctx.shadowBlur=0;const g=ctx.createLinearGradient(0,cy-h/2,0,cy+h/2);g.addColorStop(0,c+'55');g.addColorStop(1,c+'11');rr(cx-w/2+w*0.08,cy-h/2+w*0.1,w*0.84,h-w*0.2,w*0.12);ctx.fillStyle=g;ctx.fill();ctx.restore();}
// SIM card
function sim(cx,cy,s,c,a=1){ctx.save();ctx.globalAlpha*=a;const w=s,h=s*1.3,cut=s*0.28;ctx.beginPath();ctx.moveTo(cx-w/2,cy-h/2);ctx.lineTo(cx+w/2-cut,cy-h/2);ctx.lineTo(cx+w/2,cy-h/2+cut);
  ctx.lineTo(cx+w/2,cy+h/2);ctx.lineTo(cx-w/2,cy+h/2);ctx.closePath();ctx.fillStyle=c+'2a';ctx.fill();stroke(c,3);ctx.stroke();
  rr(cx-w*0.28,cy-h*0.12,w*0.56,h*0.42,6);ctx.fillStyle=c;ctx.globalAlpha*=0.85;ctx.fill();stroke('#0a1020',2);ctx.beginPath();
  ctx.moveTo(cx,cy-h*0.12);ctx.lineTo(cx,cy+h*0.3);ctx.moveTo(cx-w*0.28,cy+h*0.09);ctx.lineTo(cx+w*0.28,cy+h*0.09);ctx.stroke();ctx.restore();}
// label chip; returns width
function pill(x,y,label,c,o={}){const size=o.size||28;ctx.save();ctx.globalAlpha*=(o.alpha??1);ctx.font=font(o.weight||700,size,o.font);ctx.letterSpacing=(o.ls||0)+'px';
  const w=ctx.measureText(label).width+size*1.2,h=size*1.75;const x0=o.align==='left'?x:o.align==='right'?x-w:x-w/2;
  rr(x0,y-h/2,w,h,h/2);ctx.fillStyle=c+(o.fillA||'22');ctx.fill();stroke(c,2);ctx.stroke();ctx.fillStyle=o.textColor||COL.white;ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(label,x0+size*0.6,y+1);ctx.restore();return w;}
// stylised street map panel
function mapPanel(x,y,w,h,a=1){ctx.save();ctx.globalAlpha*=a;rr(x,y,w,h,28);ctx.fillStyle='rgba(12,20,42,0.88)';ctx.fill();stroke('rgba(46,230,255,0.35)',2);ctx.stroke();
  ctx.save();rr(x,y,w,h,28);ctx.clip();const r=rng(5);ctx.fillStyle='rgba(120,150,210,0.07)';
  for(let i=0;i<26;i++){ctx.fillRect(x+r()*w,y+r()*h,40+r()*110,30+r()*90);}
  stroke('rgba(150,175,230,0.22)',10);ctx.beginPath();for(const fy of[0.22,0.52,0.8]){ctx.moveTo(x,y+h*fy);ctx.lineTo(x+w,y+h*fy+20);}
  for(const fx of[0.2,0.5,0.8]){ctx.moveTo(x+w*fx,y);ctx.lineTo(x+w*fx-30,y+h);}ctx.stroke();
  stroke('rgba(150,175,230,0.3)',16);ctx.beginPath();ctx.moveTo(x,y+h*0.95);ctx.lineTo(x+w,y+h*0.1);ctx.stroke();ctx.restore();ctx.restore();}
// monospace data table with row-by-row typing. cols=[[header,width],...], rows=[[...],...]
function dataTable(x,y,cols,rows,shownRows,rowH,o={}){const size=o.size||24;ctx.save();ctx.font=font(700,size,MONO);let cx=x;
  cols.forEach(([h,w])=>{ctx.fillStyle=COL.cyan;ctx.fillText(h,cx,y);cx+=w;});
  ctx.fillStyle='rgba(46,230,255,0.35)';ctx.fillRect(x,y+14,cols.reduce((s,c)=>s+c[1],0)-20,2);
  rows.forEach((row,ri)=>{const k=clamp(shownRows-ri);if(k<=0)return;const ry=y+rowH*(ri+1);
    if(o.highlight===ri&&o.hk>0){ctx.save();ctx.globalAlpha=o.hk;rr(x-14,ry-size-12,cols.reduce((s,c)=>s+c[1],0)-6,rowH-6,12);ctx.fillStyle='rgba(255,182,39,0.16)';ctx.fill();stroke(COL.amber,2.5);ctx.stroke();ctx.restore();}
    let cx=x;row.forEach((cell,ci)=>{const n=Math.floor(cell.length*clamp(k*1.6-ci*0.12));ctx.fillStyle=ci===0?COL.dim:COL.white;ctx.font=font(ci===0?500:600,size,MONO);ctx.fillText(cell.slice(0,n),cx,ry);cx+=cols[ci][1];});});
  ctx.restore();}
// law / record card with typed body (segs = [[text, highlight?],...])
function richType(segs,x,y,maxW,size,lh,shown,o={}){ctx.save();ctx.font=font(o.weight||600,size);const words=[];segs.forEach(([s,h])=>s.split(/(\s+)/).forEach(w=>{if(w)words.push([w,h]);}));
  let cx=x,cy=y,n=0;for(const[w,h]of words){const ww=ctx.measureText(w).width;if(!/^\s+$/.test(w)&&cx+ww>x+maxW){cx=x;cy+=lh;}if(/^\s+$/.test(w)&&cx===x)continue;
    const vis=Math.max(0,Math.min(w.length,shown-n));if(vis>0){ctx.fillStyle=h?COL.amber:(o.color||COL.white);if(h){ctx.shadowColor=COL.amber;ctx.shadowBlur=14;}else ctx.shadowBlur=0;ctx.fillText(w.slice(0,vis),cx,cy);}
    n+=w.length;cx+=ww;}
  if(shown<n&&Math.floor(shown*0.5)%2===0){ctx.fillStyle=COL.cyan;ctx.fillRect(cx+4,cy-size*0.8,4,size*0.95);}ctx.restore();return n;}
function lawCard(x,y,w,h,head1,head2,segs,shown,c=COL.amber,a=1,o={}){ctx.save();ctx.globalAlpha*=a;card(x,y,w,h,c);
  txt(head1,x+48,y+70,{size:fit(head1,800,BODY,w-96,30,3),weight:800,color:c,ls:3});if(head2)txt(head2,x+48,y+114,{size:28,weight:500,color:COL.dim});
  ctx.fillStyle=c+'55';ctx.fillRect(x+48,y+(head2?140:96),w-96,2);richType(segs,x+48,y+(head2?204:160),w-96,o.size||38,o.lh||54,shown);ctx.restore();}

// ---------- logo (assets/logo.png + assets/wordmark.png when present, else shield + text) ----------
const LOGO=new Image(),WORD=new Image();let LOGO_OK=false,WORD_OK=false;
function logoMark(cx,cy,r,a=1){ctx.save();ctx.globalAlpha*=a;if(LOGO_OK){const s=2*r/Math.max(LOGO.width,LOGO.height);
    ctx.shadowColor='rgba(46,230,255,0.55)';ctx.shadowBlur=r*0.35;ctx.drawImage(LOGO,cx-LOGO.width*s/2,cy-LOGO.height*s/2,LOGO.width*s,LOGO.height*s);}
  else shield(cx,cy+r*0.05,r*0.85,COL.cyan);ctx.restore();}
// brand name: the owner's wordmark image if present, else text. (x,y) = left/centre baseline-ish anchor
function brand(x,y,h,o={}){ctx.save();ctx.globalAlpha*=(o.alpha??1);if(WORD_OK){const w=WORD.width*h/WORD.height;const x0=o.align==='center'?x-w/2:x;
    if(o.glow){ctx.shadowColor=COL.cyan;ctx.shadowBlur=o.glow;}ctx.drawImage(WORD,x0,y-h*0.82,w,h);}
  else txt('DIGITAL CRIMES',x,y,{size:h*0.95,weight:900,font:DISP,ls:h*0.14,align:o.align||'left',glow:o.glow,glowColor:COL.cyan});ctx.restore();}
// HUD-style logo reveal ("interface"): rotating rings, ticks, scan sweep
function logoHUD(cx,cy,R,lt){const k=eOut(p(lt,0,0.9));ctx.save();
  for(let i=0;i<72;i++){const ang=i/72*Math.PI*2-Math.PI/2;if(i/72>k)break;const long=i%6===0;stroke(i%18===0?COL.amber:'rgba(46,230,255,0.6)',long?4:2);
    ctx.beginPath();ctx.moveTo(cx+Math.cos(ang)*R*1.02,cy+Math.sin(ang)*R*1.02);ctx.lineTo(cx+Math.cos(ang)*R*(long?1.12:1.07),cy+Math.sin(ang)*R*(long?1.12:1.07));ctx.stroke();}
  ctx.save();ctx.translate(cx,cy);ctx.rotate(lt*0.6);stroke(COL.cyan,3);ctx.setLineDash([R*0.5,R*0.18]);ctx.globalAlpha=k;ctx.beginPath();ctx.arc(0,0,R*0.92,0,7);ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-lt*0.9);stroke(COL.violet,2);ctx.setLineDash([R*0.08,R*0.1]);ctx.globalAlpha=k*0.8;ctx.beginPath();ctx.arc(0,0,R*0.8,0,7);ctx.stroke();ctx.restore();
  const sw=(lt*1.4)%(Math.PI*2);const g=ctx.createConicGradient?ctx.createConicGradient(sw,cx,cy):null;
